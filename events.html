<script>
// Load events page content from CMS
async function loadEventsPageContent() {
  try {
    const pageContent = await PulseSheetsCMS.getPageContent('EVENTS');
    
    if (pageContent.pageTitle) document.getElementById('events-page-title').textContent = pageContent.pageTitle;
    if (pageContent.pageDescription) document.getElementById('events-page-description').textContent = pageContent.pageDescription;
    if (pageContent.upcomingTitle) document.getElementById('events-upcoming-title').textContent = pageContent.upcomingTitle;
    if (pageContent.upcomingDescription) document.getElementById('events-upcoming-description').textContent = pageContent.upcomingDescription;
  } catch (error) {
    console.error('Error loading events page content:', error);
    // Keep default content if CMS fails
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', loadEventsPageContent);
} else {
  loadEventsPageContent();
}
</script>
