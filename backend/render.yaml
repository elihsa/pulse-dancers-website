services:
  - type: web
    name: parkbuddy-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://parkbuddy-sa.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        value: https://parkbuddy-sa.vercel.app/api/payments/callback
      - key: CLOUDINARY_CLOUD_NAME
        value: zmfiwlvf
      - key: CLOUDINARY_API_KEY
        value: 629992729883581
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: noreply@parkbuddy.co.za
      - key: PLATFORM_FEE_PERCENTAGE
        value: "15"
